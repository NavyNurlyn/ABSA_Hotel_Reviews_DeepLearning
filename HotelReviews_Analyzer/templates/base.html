<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HotelAnalyzer AI{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a56db; --primary-dark: #1245b8;
      --primary-light: #e8f0fe; --accent: #0ea5e9;
      --success: #16a34a; --success-light: #dcfce7;
      --danger: #dc2626; --danger-light: #fee2e2;
      --neutral: #6b7280; --neutral-light: #f3f4f6;
      --sidebar-w: 220px; --card-radius: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
      --shadow-md: 0 4px 16px rgba(0,0,0,.10);
    }
    * { box-sizing: border-box; }
    body { font-family: "Inter", sans-serif; background: #f0f4ff; color: #1e293b; margin: 0; min-height: 100vh; }
    h1,h2,h3,h4,h5,h6 { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 700; }

    /* ── Sidebar ── */
    .sidebar {
      position: fixed; top: 0; left: 0;
      width: var(--sidebar-w); height: 100vh;
      background: #0f2460;
      display: flex; flex-direction: column;
      z-index: 100;
      box-shadow: 2px 0 20px rgba(15,36,96,.3);
      border-right: 1px solid rgba(255,255,255,.06);
    }
    .sidebar-brand {
      padding: 20px 16px 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .sidebar-brand a { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .brand-logo-img {
      width: 62px; height: 62px;
      border-radius: 14px;
      object-fit: contain;
      background: rgba(255,255,255,.08);
      padding: 4px;
      border: 1.5px solid rgba(255,255,255,.15);
    }
    .brand-logo-svg {
      width: 62px; height: 62px;
      border-radius: 14px;
      background: rgba(255,255,255,.06);
      padding: 6px;
      border: 1.5px solid rgba(255,255,255,.12);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-name {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-weight: 800; font-size: 14px; color: #fff;
      letter-spacing: -.3px; text-align: center; line-height: 1.2;
    }
    .brand-sub {
      font-size: 9px; color: rgba(255,255,255,.45);
      font-weight: 500; letter-spacing: .8px;
      text-transform: uppercase; text-align: center;
    }

    .sidebar-nav { flex: 1; padding: 14px 10px; overflow-y: auto; }
    .nav-section-label {
      font-size: 9px; font-weight: 700; letter-spacing: 1.2px;
      text-transform: uppercase; color: rgba(255,255,255,.3);
      padding: 10px 10px 4px; margin-top: 4px;
    }
    .nav-link-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 10px;
      color: rgba(255,255,255,.65); text-decoration: none;
      font-size: 13px; font-weight: 500;
      transition: all .18s; margin-bottom: 1px;
    }
    .nav-link-item:hover { background: rgba(255,255,255,.09); color: #fff; }
    .nav-link-item.active { background: rgba(26,86,219,.55); color: #fff; font-weight: 600; border-left: 3px solid #60a5fa; }
    .nav-link-item .nav-icon { font-size: 16px; width: 18px; text-align: center; flex-shrink: 0; }

    .sidebar-footer {
      padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.07);
      font-size: 10px; color: rgba(255,255,255,.25); text-align: center;
    }

    /* ── Main ── */
    .main-wrapper { margin-left: var(--sidebar-w); min-height: 100vh; }
    .main-content { padding: 28px 32px; }

    .card-modern {
      background: #fff; border-radius: var(--card-radius);
      border: none; box-shadow: var(--shadow-sm); padding: 22px;
    }

    /* Sentimen badges */
    .badge-positif { background: var(--success-light); color: var(--success); font-weight: 600; font-size: 13px; padding: 3px 12px; border-radius: 20px; }
    .badge-negatif { background: var(--danger-light); color: var(--danger); font-weight: 600; font-size: 13px; padding: 3px 12px; border-radius: 20px; }
    .badge-none    { background: var(--neutral-light); color: var(--neutral); font-weight: 500; font-size: 13px; padding: 3px 12px; border-radius: 20px; }

    .td-positif { background: #f0fdf4 !important; color: #166534; font-weight: 600; }
    .td-negatif { background: #fff1f2 !important; color: #991b1b; font-weight: 600; }
    .td-none    { background: #f8fafc !important; color: #94a3b8; }

    .btn-primary-custom {
      background: linear-gradient(135deg, #1a56db, #0ea5e9);
      color: #fff; border: none; border-radius: 10px;
      padding: 9px 22px; font-weight: 600; font-size: 14px;
      transition: all .2s; box-shadow: 0 3px 10px rgba(26,86,219,.28);
      cursor: pointer;
    }
    .btn-primary-custom:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(26,86,219,.38); color: #fff; }

    .spinner-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(255,255,255,.75); z-index: 9999;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; backdrop-filter: blur(2px);
    }
    .spinner-overlay.show { display: flex; }
    .spinner-ring {
      width: 48px; height: 48px; border: 4px solid #e8f0fe;
      border-top: 4px solid var(--primary); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .alert-custom { border-radius: 12px; border: none; font-size: 14px; }

    @media (max-width: 768px) {
      .sidebar { width: 60px; }
      .brand-name, .brand-sub, .nav-link-item span, .nav-section-label, .sidebar-footer { display: none; }
      .brand-logo-svg { width: 40px; height: 40px; }
      .nav-link-item { justify-content: center; padding: 10px; }
      .main-wrapper { margin-left: 60px; }
      .main-content { padding: 16px; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <a href="{{ url_for('home') }}">
      <!-- Logo SVG mirip gambar user: bangunan + bintang + latar biru -->
      <div class="brand-logo-svg">
        <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
          <!-- Stars -->
          <text x="40" y="16" text-anchor="middle" font-size="12" fill="white">★ ★ ★</text>
          <!-- Main tall building -->
          <rect x="31" y="22" width="18" height="38" fill="white" rx="1.5"/>
          <rect x="33" y="25" width="4" height="4" fill="#0f2460" rx="0.5"/>
          <rect x="39" y="25" width="4" height="4" fill="#0f2460" rx="0.5"/>
          <rect x="33" y="32" width="4" height="4" fill="#0f2460" rx="0.5"/>
          <rect x="39" y="32" width="4" height="4" fill="#0f2460" rx="0.5"/>
          <rect x="33" y="39" width="4" height="4" fill="#0f2460" rx="0.5"/>
          <rect x="39" y="39" width="4" height="4" fill="#0f2460" rx="0.5"/>
          <!-- Left building -->
          <rect x="16" y="34" width="16" height="26" fill="rgba(255,255,255,0.85)" rx="1"/>
          <!-- Right building -->
          <rect x="48" y="34" width="16" height="26" fill="rgba(255,255,255,0.85)" rx="1"/>
          <!-- House roofs -->
          <polygon points="14,60 24,50 34,60" fill="white"/>
          <polygon points="46,60 56,50 66,60" fill="white"/>
          <!-- Small roof windows -->
          <rect x="22" y="54" width="4" height="5" fill="#0f2460" rx="2"/>
          <rect x="54" y="54" width="4" height="5" fill="#0f2460" rx="2"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">HotelAnalyzer</div>
        <div class="brand-sub">AI for Hospitality</div>
      </div>
    </a>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Navigasi</div>

    <a href="{{ url_for('home') }}"
       class="nav-link-item {% if request.endpoint == 'home' %}active{% endif %}">
      <span class="nav-icon"><i class="bi bi-house-door"></i></span>
      <span>Beranda</span>
    </a>

    <a href="{{ url_for('analisis_teks') }}"
       class="nav-link-item {% if request.endpoint == 'analisis_teks' %}active{% endif %}">
      <span class="nav-icon"><i class="bi bi-chat-text"></i></span>
      <span>Analisis Teks</span>
    </a>

    <a href="{{ url_for('analisis_file') }}"
       class="nav-link-item {% if request.endpoint == 'analisis_file' %}active{% endif %}">
      <span class="nav-icon"><i class="bi bi-file-earmark-bar-graph"></i></span>
      <span>Analisis File</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    v1.0 &nbsp;·&nbsp; Deep Learning ABSA
  </div>
</aside>

<div class="main-wrapper">
  <div class="main-content">
    {% block content %}{% endblock %}
  </div>
</div>

<div class="spinner-overlay" id="loadingOverlay">
  <div class="spinner-ring"></div>
  <div style="font-weight:600;color:#1a56db;font-size:14px">Sedang menganalisis...</div>
  <div style="font-size:12px;color:#6b7280" id="loadingSubtext">Harap tunggu sebentar</div>
</div>

<!-- Modal untuk lihat ulasan panjang -->
<div class="modal fade" id="modalUlasan" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" style="border-radius:16px;border:none">
      <div class="modal-header" style="border-bottom:1px solid #f1f5f9">
        <h6 class="modal-title fw-bold">Teks Ulasan Lengkap</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="font-size:14px;line-height:1.7;color:#1e293b" id="modalUlasanText"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function showLoading(subtext = "Harap tunggu sebentar") {
  document.getElementById("loadingSubtext").textContent = subtext;
  document.getElementById("loadingOverlay").classList.add("show");
}
function hideLoading() {
  document.getElementById("loadingOverlay").classList.remove("show");
}
function badgeSentimen(val) {
  if (val === "Positif") return '<span class="badge-positif">Positif</span>';
  if (val === "Negatif") return '<span class="badge-negatif">Negatif</span>';
  return '<span class="badge-none">—</span>';
}
function tdClass(val) {
  if (val === "Positif") return "td-positif";
  if (val === "Negatif") return "td-negatif";
  return "td-none";
}
function showUlasanModal(teks) {
  document.getElementById("modalUlasanText").textContent = teks;
  new bootstrap.Modal(document.getElementById("modalUlasan")).show();
}
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
